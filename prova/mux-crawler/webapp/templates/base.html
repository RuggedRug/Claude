<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mux Dashboard Crawler{% endblock %}</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        :root {
            --sidebar-width: 250px;
        }

        body {
            min-height: 100vh;
            background-color: #f8f9fa;
        }

        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            height: 100vh;
            width: var(--sidebar-width);
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
            padding-top: 1rem;
            z-index: 1000;
        }

        .sidebar .nav-link {
            color: rgba(255, 255, 255, 0.7);
            padding: 0.75rem 1.5rem;
            border-radius: 0;
            transition: all 0.2s;
        }

        .sidebar .nav-link:hover,
        .sidebar .nav-link.active {
            color: #fff;
            background-color: rgba(255, 255, 255, 0.1);
        }

        .sidebar .nav-link i {
            margin-right: 0.75rem;
            width: 20px;
            text-align: center;
        }

        .sidebar-brand {
            padding: 1rem 1.5rem;
            color: #fff;
            font-size: 1.25rem;
            font-weight: 600;
            text-decoration: none;
            display: block;
            margin-bottom: 1rem;
        }

        .sidebar-brand:hover {
            color: #fff;
        }

        .main-content {
            margin-left: var(--sidebar-width);
            padding: 2rem;
        }

        .card {
            border: none;
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
            border-radius: 0.5rem;
        }

        .card-header {
            background-color: #fff;
            border-bottom: 1px solid #e9ecef;
            font-weight: 600;
        }

        .stat-card {
            transition: transform 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-2px);
        }

        .stat-card .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        .status-badge {
            padding: 0.35rem 0.65rem;
            border-radius: 0.25rem;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-success { background-color: #d1e7dd; color: #0f5132; }
        .status-failed { background-color: #f8d7da; color: #842029; }
        .status-processing { background-color: #fff3cd; color: #664d03; }
        .status-pending { background-color: #e2e3e5; color: #41464b; }

        .table-responsive {
            border-radius: 0.5rem;
            overflow: hidden;
        }

        .table thead th {
            background-color: #f8f9fa;
            border-bottom: 2px solid #dee2e6;
            font-weight: 600;
            white-space: nowrap;
        }

        .table tbody tr:hover {
            background-color: #f8f9fa;
        }

        .btn-action {
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-weight: 500;
        }

        .pulse {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .truncate {
            max-width: 200px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Toast notifications */
        .toast-container {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 1100;
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Sidebar -->
    <nav class="sidebar">
        <a href="{{ url_for('index') }}" class="sidebar-brand">
            <i class="bi bi-camera-video"></i> Mux Crawler
        </a>

        <ul class="nav flex-column">
            <li class="nav-item">
                <a class="nav-link {% if request.endpoint == 'index' %}active{% endif %}" href="{{ url_for('index') }}">
                    <i class="bi bi-speedometer2"></i> Dashboard
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if request.endpoint in ['data_browser', 'view_table'] %}active{% endif %}" href="{{ url_for('data_browser') }}">
                    <i class="bi bi-table"></i> Data Browser
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if request.endpoint == 'settings' %}active{% endif %}" href="{{ url_for('settings') }}">
                    <i class="bi bi-gear"></i> Settings
                </a>
            </li>
        </ul>

        <hr class="mx-3 my-4" style="border-color: rgba(255,255,255,0.1);">

        <div class="px-3">
            <small class="text-white-50">Quick Actions</small>
            <div class="mt-2">
                <button class="btn btn-outline-light btn-sm w-100 mb-2" onclick="startExtraction(false)">
                    <i class="bi bi-play-fill"></i> Run Extraction
                </button>
                <button class="btn btn-outline-light btn-sm w-100" onclick="startExtraction(true)">
                    <i class="bi bi-eye"></i> Run (Headed)
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <!-- Toast Container -->
    <div class="toast-container"></div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Show toast notification
        function showToast(message, type = 'info') {
            const container = document.querySelector('.toast-container');
            const toastId = 'toast-' + Date.now();

            const bgClass = {
                'success': 'bg-success',
                'error': 'bg-danger',
                'warning': 'bg-warning',
                'info': 'bg-primary'
            }[type] || 'bg-primary';

            const html = `
                <div id="${toastId}" class="toast ${bgClass} text-white" role="alert">
                    <div class="toast-body d-flex align-items-center">
                        <span>${message}</span>
                        <button type="button" class="btn-close btn-close-white ms-auto" data-bs-dismiss="toast"></button>
                    </div>
                </div>
            `;

            container.insertAdjacentHTML('beforeend', html);
            const toast = new bootstrap.Toast(document.getElementById(toastId));
            toast.show();

            // Remove element after hidden
            document.getElementById(toastId).addEventListener('hidden.bs.toast', function() {
                this.remove();
            });
        }

        // Start extraction
        async function startExtraction(headed = false) {
            try {
                const response = await fetch('/extraction/start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ headed })
                });

                const data = await response.json();

                if (response.ok) {
                    showToast(`Extraction started (${headed ? 'headed' : 'headless'})`, 'success');
                    if (typeof updateStatus === 'function') updateStatus();
                } else {
                    showToast(data.error || 'Failed to start extraction', 'error');
                }
            } catch (error) {
                showToast('Error: ' + error.message, 'error');
            }
        }

        // Stop extraction
        async function stopExtraction() {
            try {
                const response = await fetch('/extraction/stop', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });

                const data = await response.json();

                if (response.ok) {
                    showToast('Extraction stopped', 'warning');
                    if (typeof updateStatus === 'function') updateStatus();
                } else {
                    showToast(data.error || 'Failed to stop extraction', 'error');
                }
            } catch (error) {
                showToast('Error: ' + error.message, 'error');
            }
        }

        // Clear auth
        async function clearAuth() {
            if (!confirm('This will clear your authentication. You will need to log in again. Continue?')) {
                return;
            }

            try {
                const response = await fetch('/auth/clear', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });

                const data = await response.json();

                if (response.ok) {
                    showToast('Authentication cleared. Run headed extraction to re-authenticate.', 'success');
                    if (typeof updateStatus === 'function') updateStatus();
                } else {
                    showToast(data.error || 'Failed to clear auth', 'error');
                }
            } catch (error) {
                showToast('Error: ' + error.message, 'error');
            }
        }
    </script>

    {% block extra_js %}{% endblock %}
</body>
</html>
